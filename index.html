<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISTRIBUCIONES E&G</title>
    <link rel="stylesheet" href="style.css?v=105">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>DISTRIBUCIONES E&G</h1>
        </div>
        <div class="tabs">
            <button onclick="switchTab('tienda')" class="active" id="tab-tienda"><i class="fa-solid fa-shop"></i> Tienda</button>
            <button onclick="switchTab('clientes')" id="tab-clientes"><i class="fa-solid fa-users"></i> Clientes</button>
            <button onclick="toggleAdmin()" id="btn-admin"><i class="fa-solid fa-user-shield"></i></button>
        </div>
    </header>

    <div id="view-tienda" class="view-section active">
        <div class="controls-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-prod" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
            </div>
            
            <select id="cat-filter" onchange="filtrarProductos()">
                <option value="Todas">Todas las categorías</option>
                <optgroup label="🎮 Tecnología y Gamer">
                    <option value="Gamer">Accesorios Gamer</option>
                    <option value="Periferico">Periféricos (Mouse/Teclado)</option>
                    <option value="Audio">Audio y Audífonos</option>
                    <option value="Cables">Cables y Cargadores</option>
                    <option value="Almacenamiento">Almacenamiento (USB/MicroSD)</option>
                    <option value="Protectores">Fundas y Protectores</option>
                    <option value="Celulares">Celulares y Tablets</option>
                    <option value="Componentes">Componentes PC</option>
                </optgroup>
                <optgroup label="🛒 Abarrotes y Despensa">
                    <option value="Granos">Granos y Cereales</option>
                    <option value="Aceites">Aceites y Mantecas</option>
                    <option value="Pastas">Pastas y Sopas Instantáneas</option>
                    <option value="Enlatados">Enlatados y Conservas</option>
                    <option value="Salsas">Salsas y Condimentos</option>
                    <option value="Especias">Azúcar, Sal y Especias</option>
                    <option value="Lacteos">Lácteos y Huevos</option>
                    <option value="Embutidos">Embutidos y Carnes</option>
                    <option value="Panaderia">Panadería y Repostería</option>
                </optgroup>
                <optgroup label="🥤 Bebidas y Snacks">
                    <option value="Refrescos">Refrescos y Jugos</option>
                    <option value="Agua">Agua Purificada</option>
                    <option value="Energizantes">Bebidas Energizantes</option>
                    <option value="Cervezas">Cervezas y Licores</option>
                    <option value="Snacks">Snacks y Churros</option>
                    <option value="Dulces">Dulces y Chocolates</option>
                    <option value="Cafe">Café y Té</option>
                </optgroup>
                <optgroup label="🧼 Higiene y Limpieza">
                    <option value="Detergentes">Detergentes y Suavizantes</option>
                    <option value="Limpieza">Limpieza del Hogar</option>
                    <option value="Higiene">Higiene Corporal</option>
                    <option value="Capilar">Cuidado Capilar (Shampoo/Gel)</option>
                    <option value="Dental">Cuidado Dental</option>
                    <option value="Papel">Papel y Desechables</option>
                </optgroup>
                <optgroup label="📦 Variedades y Otros">
                    <option value="Medicinas">Medicinas (OTC)</option>
                    <option value="Bebes">Cuidado del Bebé</option>
                    <option value="Mascotas">Mascotas</option>
                    <option value="Papeleria">Librería y Papelería</option>
                    <option value="Ferreteria">Ferretería Básica</option>
                    <option value="Plasticos">Hogar y Plásticos</option>
                    <option value="Cosmeticos">Cosméticos y Belleza</option>
                </optgroup>
            </select>
            
            <div class="view-toggle">
                <button id="btn-grid" class="active" onclick="cambiarVista('grid')" title="Cuadrícula"><i class="fa-solid fa-border-all"></i></button>
                <button id="btn-list" onclick="cambiarVista('list')" title="Lista"><i class="fa-solid fa-list"></i></button>
            </div>

            <button id="btn-add-producto-nuevo" onclick="abrirModalProducto()" style="display:none; background:var(--success); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; cursor:pointer;"><i class="fa-solid fa-plus"></i> Nuevo</button>
        </div>
        <main><section id="productos-grid" class="grid"></section></main>
    </div>

    <!-- ==== PESTAÑA CLIENTES ==== -->
    <div id="view-clientes" class="view-section">
        <div class="controls-container">
            <div class="search-box">
                <i class="fa-solid fa-user-magnifying-glass"></i>
                <input type="text" id="search-client" placeholder="Buscar por cliente..." onkeyup="filtrarClientes()">
            </div>
            <input type="month" id="mes-filter" class="mes-filter-input" onchange="filtrarClientes()" title="Filtrar por Mes y Año">
        </div>
        <div class="table-container">
            <table id="tabla-clientes">
                <thead><tr><th>Tienda / Cliente</th><th>Contacto</th><th>Entrega</th><th>Acción</th></tr></thead>
                <tbody id="lista-clientes"></tbody>
            </table>
        </div>
    </div>

    <button id="btn-flotante-carrito" onclick="abrirCarrito()"><i class="fa-solid fa-cart-shopping"></i><span id="contador-carrito">0</span></button>

    <!-- ==== MODAL: CARRITO ==== -->
    <div id="modal-carrito" class="modal-oculto">
        <div class="modal-contenido">
            <div class="modal-header"><h2>Resumen de Orden</h2><button class="btn-cerrar" onclick="cerrarCarrito()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div id="carrito-items"></div>
                <div class="totales-caja">
                    <div class="subtotal-row">Subtotal: <span>Lps. <span id="subtotal-display">0.00</span></span></div>
                    <div class="total-row">Total: <span>Lps. <span id="gran-total">0.00</span></span></div>
                </div>
                <form id="form-cotizacion" onsubmit="guardarCotizacion(event)">
                    <h3 class="form-title">Datos del Cliente</h3>
                    <input type="text" id="c-nombre" placeholder="Nombre del Cliente" required>
                    <input type="text" id="c-tienda" placeholder="Nombre de la Tienda" required>
                    <input type="tel" id="c-tel" placeholder="Número de Teléfono" required>
                    <input type="text" id="c-lugar" placeholder="Lugar / Dirección Exacta" required>
                    <div class="fecha-box"><label>Día de entrega:</label><input type="date" id="c-fecha-entrega" required></div>
                    <button type="submit" id="btn-guardar" class="btn-primario"><i class="fa-solid fa-floppy-disk"></i> Guardar Orden</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==== MODAL: DETALLE CLIENTE (AQUÍ ESTÁ EL BOTÓN) ==== -->
    <div id="modal-detalle" class="modal-oculto">
        <div class="modal-contenido">
            <div class="modal-header"><h2>Detalle de Orden</h2><button class="btn-cerrar" onclick="cerrarDetalle()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div id="detalle-info" class="detalle-info-caja" style="padding:0; border:none; background:transparent;"></div>
                <h3 style="color:#1e293b; margin-top:20px; font-size:1.1rem;">Productos Solicitados</h3>
                <div id="detalle-items" class="detalle-items-caja" style="margin-bottom:20px;"></div>
                
                <!-- AQUI ESTÁ EL BOTÓN PDF ADMIN -->
                <div class="botones-accion-detalle">
                    <button onclick="editarCotizacion()" class="btn-secundario"><i class="fa-solid fa-pen-to-square"></i> Modificar</button>
                    <button onclick="generarFactura()" class="btn-primario"><i class="fa-solid fa-file-invoice"></i> PDF Cliente</button>
                    <button onclick="enviarWhatsApp()" class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> Enviar a WA</button>
                    <button onclick="generarFacturaAdmin()" class="btn-admin-pdf"><i class="fa-solid fa-file-invoice-dollar"></i> PDF Rentabilidad</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==== MODAL: AGREGAR PRODUCTO NUEVO ==== -->
    <div id="modal-producto" class="modal-oculto">
        <div class="modal-contenido">
            <div class="modal-header"><h2>Agregar Producto</h2><button type="button" class="btn-cerrar" onclick="cerrarModalProducto()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <form id="form-producto" onsubmit="guardarProductoNuevo(event)" style="display: flex; flex-direction: column; gap: 15px;">
                    <label style="background: #eef2ff; color: var(--accent); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; border: 2px dashed #c7d2fe;">
                        <i class="fa-solid fa-camera" style="font-size: 24px; display:block; margin-bottom:5px;"></i> Tomar o Subir Foto
                        <input type="file" id="p-foto" accept="image/*" capture="environment" onchange="procesarImagen(event)" style="display:none;">
                    </label>
                    <p id="foto-estado" style="text-align:center; font-size:0.8rem; color:var(--success); margin:0; display:none;"><i class="fa-solid fa-check-circle"></i> Foto lista</p>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Código / SKU</label>
                        <input type="text" id="p-codigo" placeholder="Ej: PROD-01" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Marca</label>
                        <input type="text" id="p-marca" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Producto</label>
                        <input type="text" id="p-nombre" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Categoría</label>
                        <select id="p-categoria" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif; background:white;">
                            <option value="">Selecciona la Categoría</option>
                            <optgroup label="🎮 Tecnología y Gamer"><option value="Gamer">Accesorios Gamer</option><option value="Periferico">Periféricos (Mouse/Teclado)</option><option value="Audio">Audio y Audífonos</option><option value="Cables">Cables y Cargadores</option><option value="Almacenamiento">Almacenamiento (USB/MicroSD)</option><option value="Protectores">Fundas y Protectores</option><option value="Celulares">Celulares y Tablets</option><option value="Componentes">Componentes PC</option></optgroup>
                            <optgroup label="🛒 Abarrotes y Despensa"><option value="Granos">Granos y Cereales</option><option value="Aceites">Aceites y Mantecas</option><option value="Pastas">Pastas y Sopas Instantáneas</option><option value="Enlatados">Enlatados y Conservas</option><option value="Salsas">Salsas y Condimentos</option><option value="Especias">Azúcar, Sal y Especias</option><option value="Lacteos">Lácteos y Huevos</option><option value="Embutidos">Embutidos y Carnes</option><option value="Panaderia">Panadería y Repostería</option></optgroup>
                            <optgroup label="🥤 Bebidas y Snacks"><option value="Refrescos">Refrescos y Jugos</option><option value="Agua">Agua Purificada</option><option value="Energizantes">Bebidas Energizantes</option><option value="Cervezas">Cervezas y Licores</option><option value="Snacks">Snacks y Churros</option><option value="Dulces">Dulces y Chocolates</option><option value="Cafe">Café y Té</option></optgroup>
                            <optgroup label="🧼 Higiene y Limpieza"><option value="Detergentes">Detergentes y Suavizantes</option><option value="Limpieza">Limpieza del Hogar</option><option value="Higiene">Higiene Corporal</option><option value="Capilar">Cuidado Capilar (Shampoo/Gel)</option><option value="Dental">Cuidado Dental</option><option value="Papel">Papel y Desechables</option></optgroup>
                            <optgroup label="📦 Variedades y Otros"><option value="Medicinas">Medicinas (OTC)</option><option value="Bebes">Cuidado del Bebé</option><option value="Mascotas">Mascotas</option><option value="Papeleria">Librería y Papelería</option><option value="Ferreteria">Ferretería Básica</option><option value="Plasticos">Hogar y Plásticos</option><option value="Cosmeticos">Cosméticos y Belleza</option></optgroup>
                        </select>
                    </div>

                    <div style="background:#f8fafc; padding:10px; border-radius:10px; border:1px solid #e2e8f0;">
                        <label style="font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom:8px; display:block;">📦 Proveedores (Opcional)</label>
                        <div id="p-prov-row1" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="p-lugar1" placeholder="Lugar 1" style="flex:2; min-width:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio1" step="0.01" placeholder="Costo 1" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <div id="p-prov-row2" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="p-lugar2" placeholder="Lugar 2" style="flex:2; min-width:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio2" step="0.01" placeholder="Costo 2" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <div id="p-prov-row3" style="display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="p-lugar3" placeholder="Lugar 3" style="flex:2; min-width:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio3" step="0.01" placeholder="Costo 3" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <div id="p-prov-row4" style="display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="p-lugar4" placeholder="Lugar 4" style="flex:2; min-width:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio4" step="0.01" placeholder="Costo 4" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <div id="p-prov-row5" style="display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="p-lugar5" placeholder="Lugar 5" style="flex:2; min-width:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio5_prov" step="0.01" placeholder="Costo 5" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <div id="p-prov-row6" style="display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="p-lugar6" placeholder="Lugar 6" style="flex:2; min-width:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio6_prov" step="0.01" placeholder="Costo 6" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <button type="button" id="p-btn-add-prov" onclick="mostrarSiguienteProveedor('p')" style="background:none; border:none; color:var(--accent); font-weight:700; font-size:0.85rem; padding:8px 0; cursor:pointer; display:flex; align-items:center; gap:5px; margin-top:4px;"><i class="fa-solid fa-circle-plus"></i> Añadir otro proveedor</button>
                    </div>

                    <div style="background:#f0fdf4; padding:10px; border-radius:10px; border:1px solid #bbf7d0;">
                        <label style="font-size: 0.75rem; font-weight: 800; color: #047857; text-transform: uppercase; margin-bottom:8px; display:block;">🏷️ Precios Mayoreo (Opcional)</label>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                            <input type="number" id="p-precio5" step="0.01" placeholder="5+ Unids" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #a7f3d0; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio6" step="0.01" placeholder="Media Doc." style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #a7f3d0; outline:none; font-family:'Inter', sans-serif;">
                            <input type="number" id="p-precio12" step="0.01" placeholder="Docena" style="flex:1; min-width:80px; padding:10px; border-radius:8px; border:1px solid #a7f3d0; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <div style="display: flex; flex-direction: column; gap: 4px; width:50%;">
                            <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Stock Disp.</label>
                            <input type="number" id="p-stock" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px; width:50%;">
                            <label style="font-size: 0.75rem; font-weight: 800; color: #3b82f6; text-transform: uppercase;">Costo Gral (Lps)</label>
                            <input type="number" id="p-costo" step="0.01" placeholder="0.00" required style="padding:12px; border-radius:10px; border:1px solid #bfdbfe; background:#eff6ff; color:#1d4ed8; font-weight:bold; outline:none; font-family:'Inter', sans-serif;">
                        </div>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 800; color: #10b981; text-transform: uppercase;">Precio Detalle (Lps)</label>
                        <input type="number" id="p-precio" step="0.01" placeholder="0.00" required style="padding:14px; border-radius:10px; border:2px solid #a7f3d0; background:#f0fdf4; font-weight:bold; color:#047857; font-size:1.1rem; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    <button type="submit" id="btn-guardar-prod" class="btn-primario" style="margin-top:5px;"><i class="fa-solid fa-cloud-arrow-up"></i> Guardar en Inventario</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==== MODAL: EDITAR PRODUCTO EXISTENTE ==== -->
    <div id="modal-editar-producto" class="modal-oculto">
        <div class="modal-contenido">
            <div class="modal-header"><h2>Editar Producto</h2><button type="button" class="btn-cerrar" onclick="cerrarModalEditar()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <form id="form-editar-producto" onsubmit="guardarEdicionProducto(event)" style="display: flex; flex-direction: column; gap: 15px;">
                    <label style="background: #eef2ff; color: var(--accent); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; border: 2px dashed #c7d2fe;">
                        <i class="fa-solid fa-camera-rotate" style="font-size: 24px; display:block; margin-bottom:5px;"></i> Cambiar Foto (Opcional)
                        <input type="file" id="e-foto" accept="image/*" onchange="procesarImagenEdicion(event)" style="display:none;">
                    </label>
                    <p id="e-foto-estado" style="text-align:center; font-size:0.8rem; color:var(--success); margin:0; display:none;"><i class="fa-solid fa-check-circle"></i> Nueva foto lista</p>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Código / SKU</label>
                        <input type="text" id="e-codigo" readonly style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; background:#f1f5f9; color:#64748b; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Marca</label>
                        <input type="text" id="e-marca" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Producto</label>
                        <input type="text" id="e-nombre" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Categoría</label>
                        <select id="e-categoria" required style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; outline:none; font-family:'Inter', sans-serif; background:white;">
                            <option value="">Selecciona la Categoría</option>
                            <optgroup label="🎮 Tecnología y Gamer"><option value="Gamer">Accesorios Gamer</option><option value="Periferico">Periféricos (Mouse/Teclado)</option><option value="Audio">Audio y Audífonos</option><option value="Cables">Cables y Cargadores</option><option value="Almacenamiento">Almacenamiento (USB/MicroSD)</option><option value="Protectores">Fundas y Protectores</option><option value="Celulares">Celulares y Tablets</option><option value="Componentes">Componentes PC</option></optgroup>
