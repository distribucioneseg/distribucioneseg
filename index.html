<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISTRIBUCIONES E&G</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos reparados (Usando FontAwesome CDN por estabilidad) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>DISTRIBUCIONES E&G</h1>
        </div>
        <div class="tabs">
            <button onclick="switchTab('tienda')" class="active" id="tab-tienda">Tienda</button>
            <button onclick="switchTab('clientes')" id="tab-clientes">Clientes</button>
            <button onclick="toggleAdmin()" id="btn-admin"><i class="fa-solid fa-user-shield"></i></button>
        </div>
    </header>

    <div class="controls-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-prod" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
        </div>
        <select id="cat-filter" onchange="filtrarProductos()">
            <option value="Todas">Todas las categorías</option>
        </select>
    </div>

    <div id="view-tienda" class="view-section active">
        <main>
            <section id="productos-grid" class="grid"></section>
        </main>
    </div>

    <div id="view-clientes" class="view-section">
        <div class="controls-container" style="margin-top: 0;">
            <div class="search-box">
                <i class="fa-solid fa-user-magnifying-glass"></i>
                <input type="text" id="search-client" placeholder="Buscar por cliente o tienda..." onkeyup="filtrarClientes()">
            </div>
        </div>
        <div class="table-container">
            <table id="tabla-clientes">
                <thead>
                    <tr>
                        <th>Tienda</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Lugar</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="lista-clientes"></tbody>
            </table>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE DEL CARRITO -->
    <button id="btn-flotante-carrito" onclick="abrirCarrito()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="contador-carrito">0</span>
    </button>

    <!-- VENTANA EMERGENTE (MODAL) DE COTIZACIÓN -->
    <div id="modal-carrito" class="modal-oculto">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Resumen de Cotización</h2>
                <button class="btn-cerrar" onclick="cerrarCarrito()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="modal-body">
                <div id="carrito-items">
                    <div class="empty-state">
                        <i class="fa-solid fa-cart-arrow-down" style="font-size: 48px; color: #ccc;"></i>
                        <p>No has agregado productos</p>
                    </div>
                </div>
                
                <div class="totales-caja">
                    <div class="subtotal-row">Subtotal: <span>Lps. <span id="subtotal-display">0.00</span></span></div>
                    <div class="total-row">Total a Cobrar: <span>Lps. <span id="gran-total">0.00</span></span></div>
                </div>

                <form id="form-cotizacion" onsubmit="guardarCotizacion(event)">
                    <h3 class="form-title">Datos de Entrega</h3>
                    <input type="text" id="c-nombre" placeholder="Nombre del Cliente" required>
                    <input type="text" id="c-tienda" placeholder="Nombre de la Tienda" required>
                    <input type="tel" id="c-tel" placeholder="Número de Teléfono" required>
                    <input type="text" id="c-lugar" placeholder="Lugar / Dirección Exacta" required>
                    <div class="fecha-box">
                        <label>Día de entrega:</label>
                        <input type="date" id="c-fecha-entrega" required>
                    </div>
                    <button type="submit" id="btn-guardar" class="btn-verde">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Cotización
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Forzamos al navegador a no usar caché añadiendo un parámetro falso al script -->
    <script src="app.js?v=2"></script>
</body>
</html>
